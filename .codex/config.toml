# .codex/config.toml — project-scoped configuration for Codex.
#
# IMPORTANT: Codex only loads this file when the project is **trusted**.
# Run `codex trust .` (or accept the trust prompt on first invocation) before
# expecting model/sandbox/approval/hooks settings to take effect. Use
# `ralph doctor` to confirm the effective configuration.
#
# References:
# - https://developers.openai.com/codex/config-reference
# - https://developers.openai.com/codex/hooks

# Model Codex uses in this project. This includes the Codex-side pipeline
# agents under .codex/agents/, which set no model and inherit this one, so it
# must be capable of long-running structured edits.
# No model_reasoning_effort is set here: the user-level setting applies, else
# the model's own default (low for gpt-5.6-sol as of 2026-10-02).
model = "gpt-5.6-sol"

# Sandbox mode: danger-full-access allows unrestricted filesystem access.
# approval_policy below sets when an interactive session asks for approval
# before running a command (`codex --help`, --ask-for-approval). `codex exec`
# never asks for approval, even with "on-request" (its run header shows
# `approval: never`), so the `codex exec` calls in the /plan skill (Codex
# plan advisory) and the /cross-review skill (codex reviewer) pass a
# read-only sandbox explicitly.
sandbox_mode = "danger-full-access"

# approval_policy: when an interactive Codex session pauses for user
# approval (`codex exec` runs as "never" regardless). Values codex accepts
# (config reference above):
# - "never"      : autonomous (Claude Code's permission_mode = auto equivalent)
# - "on-request" : tool asks → user approves (ralph's default for interactive sessions)
# - { granular = { ... } } : per-category approval prompts
# codex-cli 0.154.0 and later reject "untrusted", and "on-failure" is deprecated.
approval_policy = "on-request"

# Web search: prefer cached results to keep runs deterministic.
# Switch to "live" only when researching very recent topics.
web_search = "cached"

[features]
# Project-level hooks (see .codex/hooks.json below) require this flag not to
# be explicitly disabled. The official Codex hooks doc does not document a
# default for an omitted key, so `ralph doctor` is lenient on absence and
# warns when this is explicitly set to false or carries a non-boolean
# value (e.g. a quoted "false"). Keep it explicit and true so hook
# behavior does not depend on Codex's undocumented default.
hooks = true

[tui]
# Notify the operator when Codex finishes a long-running task.
notifications = true

# ---------------------------------------------------------------------------
# Profiles — examples for the user-level config.toml.
#
# Codex ignores [profiles.*] in a project-local config: it prints "Ignored
# unsupported project-local config keys ...: profiles" (observed on codex-cli
# 0.154.0 and 0.159.2). These tables only take effect if copied into the
# user-level config.toml. In this project `codex --profile <name>` does not
# apply them (e.g. `--profile review` does not make the session read-only).
# ---------------------------------------------------------------------------

[profiles.work]
# Example implementation profile.
model = "gpt-5.6-sol"
approval_policy = "on-request"

[profiles.review]
# Example read-only review profile. The /cross-review skill does not use it:
# it calls `codex exec review` with explicit -m, -c model_reasoning_effort,
# -c sandbox_mode=read-only, and --ignore-rules.
model = "gpt-5.6-sol"
sandbox_mode = "read-only"
approval_policy = "never"

# ---------------------------------------------------------------------------
# Hooks — wired via .codex/hooks.json, not the `[[hooks.*]]` tables below.
#
# hooks.json routes PostToolUse through the same layered .d dispatcher
# Claude Code uses (./.claude/hooks/ralph-dispatch.sh), so the 3-layer
# extension contract (.claude/hooks/<event>.d/ -> .ralph/local/hooks/
# <event>.d/ -> .claude/hooks/local/<event>.d/) works under Codex too.
# hooks.json is the source of truth here because, on the codex-cli release
# this was verified against, project-scoped inline `[[hooks.*]]` entries in
# this file never fired while the equivalent hooks.json entry did; do not
# reintroduce a `[hooks]` table here — `ralph doctor`
# flags that as a stale duplicate representation.
#
# The shipped command `cd`s to the git root before invoking the dispatcher
# by a repo-relative path (`cd "$(git rev-parse --show-toplevel)" &&
# ./.claude/hooks/ralph-dispatch.sh PostToolUse`), not the other way around
# (an absolute path to the dispatcher, invoked from whatever directory the
# Codex session happened to be launched in). ralph-dispatch.sh resolves its
# `.claude/hooks/<event>.d/` / `.ralph/local/hooks/<event>.d/` /
# `.claude/hooks/local/<event>.d/` layers relative to its own cwd, and that
# cwd-relative contract is shared with Claude Code's settings.json wiring,
# which always runs at the project root — so a Codex session started from a
# subdirectory previously fired the hook against an empty `.d` layer set
# (silent no-op) even though the dispatcher script itself resolved fine.
# Fixing this at the command-string level (cd first, then a relative
# invocation) keeps that shared cwd-relative contract intact instead of
# making ralph-dispatch.sh self-locating, which would be a larger change
# than this wiring fix needs.
#
# matcher targets the Codex tool name reported on a file edit
# (`apply_patch`); `Edit`/`Write`/`MultiEdit` are accepted alongside it for
# readability and parity with Claude Code's own matcher shape.
#
# IMPORTANT: hooks ONLY run when the project is trusted, [features] hooks
# = true (see above), AND the hook has been approved via the interactive
# hook-trust prompt on first invocation — an unapproved hook is skipped
# without warning. `ralph doctor` verifies the wiring but cannot probe
# trust state.
# ---------------------------------------------------------------------------

# Note: the scripts/*secret-guard.sh files are real git hooks, NOT Codex
# PostToolUse hooks. `ralph init` / `ralph upgrade` install them into Git's hook
# directory and chain pre-existing local hooks when needed.

# ---------------------------------------------------------------------------
# MCP servers — uncomment and supply credentials via environment variables.
# Never check in raw tokens; use ${ENV_VAR} substitution instead.
# ---------------------------------------------------------------------------

# [mcp_servers.example]
# url = "https://example.invalid/mcp"
# bearer_token_env = "EXAMPLE_MCP_TOKEN"
