# .codex/config.toml — project-scoped configuration for Codex.
#
# IMPORTANT: Codex only loads this file when the project is **trusted**.
# Run `codex trust .` (or accept the trust prompt on first invocation) before
# expecting model/sandbox/approval/hooks settings to take effect. Use
# `ralph doctor` to confirm the effective configuration.
#
# References:
# - https://developers.openai.com/codex/config-reference
# - https://developers.openai.com/codex/hooks

# Default model used by Codex when working in this project.
# ralph runs the post-implementation pipeline sequentially (no multi-agent),
# so the model must be capable of long-running structured edits.
model = "gpt-5.5"

# Sandbox mode: danger-full-access allows unrestricted filesystem access.
# Pair with approval_policy below to gate destructive shell calls.
sandbox_mode = "danger-full-access"

# approval_policy: when Codex pauses for user approval.
# - "never"      : autonomous (Claude Code's permission_mode = auto equivalent)
# - "on-request" : tool asks → user approves (default for ralph)
# - "untrusted"  : every tool call needs approval
approval_policy = "on-request"

# Web search: prefer cached results to keep runs deterministic.
# Switch to "live" only when researching very recent topics.
web_search = "cached"

[features]
# Required: project-level [hooks] are only loaded when hooks is enabled.
# Without this flag the [hooks] table below is silently ignored.
hooks = true

[tui]
# Notify the operator when Codex finishes a long-running task.
notifications = true

# ---------------------------------------------------------------------------
# Profiles — switch between flows with `codex --profile <name>`.
# ---------------------------------------------------------------------------

[profiles.work]
# Standard /work-style implementation profile.
model = "gpt-5.5"
approval_policy = "on-request"

[profiles.review]
# Read-only review/advisory mode (used by the /cross-review skill).
model = "gpt-5.5"
sandbox_mode = "read-only"
approval_policy = "never"

# ---------------------------------------------------------------------------
# Hooks — wired to the same scripts/ used by Claude Code's .claude/hooks/.
#
# IMPORTANT: hooks ONLY run when the project is trusted AND
# [features] hooks = true (see above). `ralph doctor` verifies both.
#
# Keep Codex hooks in this file as inline `[[hooks.*]]` entries. Do not add a
# sibling `.codex/hooks.json`; Codex warns when both representations exist in
# the same project layer, and `ralph doctor` / `scripts/verify.local.sh`
# reject that drift.
#
# Add or extend entries to mirror .claude/hooks/ behaviour.
# ---------------------------------------------------------------------------

# Default-on: fan out to the same layered .d dispatcher Claude Code uses
# (./.claude/hooks/ralph-dispatch.sh), so the 3-layer extension contract
# (.claude/hooks/<event>.d/ -> .ralph/local/hooks/<event>.d/ ->
# .claude/hooks/local/<event>.d/) works under Codex too, not just Claude
# Code. Today PostToolUse.d/ runs check_mojibake.sh (U+FFFD mojibake
# detection) via its 20-check-mojibake.sh wrapper, plus any other .d
# drop-in.
#
# Protocol note: ralph-dispatch.sh does not parse or depend on the shape of
# the hook payload it receives on stdin — it buffers stdin verbatim to a
# temp file and replays those exact bytes to every .d script's stdin
# unchanged (see ralph-dispatch.sh's own header comment). It only inspects
# each *script's own stdout* for decision-JSON fields, never the input.
# Routing Codex's PostToolUse call through the dispatcher therefore cannot
# change what check_mojibake.sh receives on stdin versus the direct-call
# form above — no adapter/shim is needed regardless of any difference
# between Codex's and Claude Code's PostToolUse payload shape. (Live
# verification of Codex's exact payload shape has not been confirmed:
# project-scoped [[hooks.*]] entries do not fire in an untrusted checkout,
# and Codex's project hook trust gate needs the interactive `codex trust`
# grant recorded in `~/.codex/config.toml`'s project trust table, which has
# no scriptable equivalent in codex-cli 0.147.0. The dispatcher's
# stdin-passthrough design makes that gap immaterial to correctness here.)
#
# Two entries are kept (Edit, Write) to mirror Codex's own tool-scoped
# `match` shape; Claude Code's single settings.json entry uses one
# `Edit|Write|MultiEdit` regex matcher instead because that's the shape its
# own hooks schema supports. Both event names are "PostToolUse", so both
# route into the same .claude/hooks/PostToolUse.d/ directory.
[[hooks.PostToolUse]]
match = { tool = "Edit" }
command = ["./.claude/hooks/ralph-dispatch.sh", "PostToolUse"]

[[hooks.PostToolUse]]
match = { tool = "Write" }
command = ["./.claude/hooks/ralph-dispatch.sh", "PostToolUse"]

# Note: the scripts/*secret-guard.sh files are real git hooks, NOT Codex
# PostToolUse hooks. `ralph init` / `ralph upgrade` install them into Git's hook
# directory and chain pre-existing local hooks when needed.

