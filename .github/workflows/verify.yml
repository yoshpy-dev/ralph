name: verify
on:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Secret scan
        run: |
          base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"
          ./scripts/secret-scan.sh --range "$base..HEAD"
      - name: Bootstrap harness
        run: ./scripts/bootstrap.sh
      - name: Shell syntax check
        run: |
          echo "Checking shell script syntax..."
          fail=0
          for f in scripts/*.sh; do
            if ! bash -n "$f" 2>/dev/null; then
              echo "FAIL: $f"
              bash -n "$f"
              fail=1
            fi
          done
          if [ "$fail" -eq 1 ]; then
            echo "Shell syntax check failed"
            exit 1
          fi
          echo "All shell scripts passed syntax check"
      - name: Run verification
        run: ./scripts/run-verify.sh
        env:
          RALPH_VERIFY_SCOPE: full
      - name: Check test coverage
        run: ./scripts/check-coverage.sh
        env:
          COVERAGE_THRESHOLD: "80"
      - name: Check pipeline order sync
        run: ./scripts/check-pipeline-sync.sh
