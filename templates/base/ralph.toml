# ralph.toml — project-level configuration for the ralph CLI.
# ralph.local.toml, a personal file of the same shape that git ignores,
# overrides this file key by key (a table merges per key, an array is
# replaced). ralph reads it from the root of the repository's main
# worktree, so every linked worktree and subdirectory uses the same one.

[doctor]
# `ralph doctor` passes when either the claude or the codex CLI is usable.
# When only one is usable, doctor warns about the other: the plan advisory
# and cross-review steps that call it do not run. When neither is usable,
# doctor fails. Set require_claude_cli or require_codex_cli to true to make
# doctor fail when that CLI is not usable, whether or not the other one is.
require_claude_cli = false
# Codex loads the project's `.codex/config.toml` only after `codex trust .`
# has been run for this project; see .codex/README.md.
require_codex_cli = false
require_go = false

# [standard] — settings of the standard flow (/plan, /implement, and the
# pipeline after it). plan_advisory = true turns on the plan advisory of
# /plan, and cross_review = true turns on /cross-review. Both are off by
# default.
# The skills read a value with `ralph config get <key>`, such as
# `ralph config get standard.cross_review`. Exit 0 prints the value: a key
# this file does not set prints its built-in default, and so does every key
# when this file does not exist. An older ralph without that command fails
# with exit 1 and `unknown command "config"` on stderr, and the shell exits
# 127 when `ralph` is not on PATH; the skills treat these two, and only
# these, as off, and record that they did. They stop on any other exit 1,
# on exit 2 (the key is not a key of one value: unknown, or a table or an
# array), and on exit 3 (this file exists but cannot be read, or any of its
# values is invalid, not only the ones below), and report it instead of
# treating the switch as off.
[standard]
plan_advisory = false
cross_review = false
# max_pipeline_cycles caps the runs of one task's pipeline after /implement,
# the first run included: the default 2 is the first run and one re-run
# after a fix (it must be >= 1). Once a task reaches it, /cross-review
# drops its fix-and-re-run option and asks how to go on. To raise the cap
# of that task only, /cross-review writes a cap into the task's
# .harness/state/standard-pipeline/cycle-count.json, and the cap in effect
# is the larger of max_pipeline_cycles and that cap. /cross-review reads
# this key with `ralph config get standard.max_pipeline_cycles` and uses
# the built-in default when that fails: silently when ralph is not on PATH
# or has no `config get`, with a line on stderr otherwise. It is a comment
# so that it keeps the built-in default, which a later release may change;
# uncomment it to set it for this project, or set it in ralph.local.toml to
# change it on your machine only.
# max_pipeline_cycles = 2
# base_branch is the branch /cross-review reviews the diff against, and the
# one scripts/secret-scan-branch.sh scans from on your machine (in CI, the
# pull request's base comes first); detect_base_branch of
# scripts/xreview-helpers.sh reads it. Empty, the default, uses origin's
# default branch, else main or master. It holds only A-Z, a-z, 0-9, ".",
# "_", "/", and "-", does not start with "-", and has no "..". It belongs
# to one machine, so only ralph.local.toml may set it and this file fails to
# load with it: the line stays a comment here; copy it into [standard] of
# ralph.local.toml to set it.
# base_branch = ""

# [reviewer] — the model and effort of the other CLI's reviewer that the
# plan advisory of /plan, /cross-review, and the plan advisory of a feature
# org's leader call. claude_model and claude_effort are for a claude
# reviewer (claude --model <claude_model> --effort <claude_effort>), and
# codex_model and codex_effort for a codex reviewer (codex -m <codex_model>
# with -c model_reasoning_effort=<codex_effort>). claude_effort is one of
# low, medium, high, xhigh, and max. The other three must be one word of
# A-Z, a-z, 0-9, ".", "_", ":", "@", "/", "+", and "-" (so a full model ID
# such as a Bedrock one fits), since they are copied into shell commands.
# An empty value, or one outside these rules, fails the load.
# /plan and /cross-review read these keys as /cross-review reads
# max_pipeline_cycles above; a feature org's leader uses the values
# `ralph org start --plan` read when it started the org. The keys are
# comments so that each keeps its built-in default, which a later release
# may change; uncomment one to set it for this project, or set it in
# ralph.local.toml to change it on your machine only.
[reviewer]
# claude_model = "fable"
# claude_effort = "xhigh"
# codex_model = "gpt-6-astra"
# codex_effort = "xhigh"

# [plan_visual] — how scripts/plan-visual.sh opens the visual review page
# of /plan, and which browser takes its screenshots. browser is the path of
# a Chrome or Chromium executable: empty (default) looks for one, "none"
# means there is none, and any other value must be an absolute path (a
# "~/" is not expanded). opener is the command that opens the page: empty
# (default) uses open on macOS, else xdg-open, "none" opens nothing, and
# any other value is one word with no space that does not start with "-".
# Both belong to one machine, so only ralph.local.toml may set them and
# this file fails to load with either: the lines stay comments here; copy
# one into [plan_visual] of ralph.local.toml to set it.
[plan_visual]
# browser = ""
# opener = ""

# [verify] — settings of scripts/run-verify.sh. base is the git revision
# that scripts/detect-changed-languages.sh diffs against to pick the
# languages the changed scope checks, such as "origin/main" or "HEAD~1":
# empty (default) uses the default branch (origin's, else that of the
# remote the branch tracks, else main or master). It has no space and does
# not start with "-". With skip_branch_secret_scan set to true,
# run-verify.sh skips the branch secret scan
# (scripts/secret-scan-branch.sh); false (default) runs it. Both belong to
# one machine or one run (a committed skip would stop the scan for
# everyone), so only ralph.local.toml may set them and this file fails to
# load with either: the lines stay comments here; copy one into [verify] of
# ralph.local.toml to set it. The scripts `ralph org gate` runs do not read
# ralph.local.toml, so the gate keeps the defaults.
[verify]
# base = ""
# skip_branch_secret_scan = false

# [org] — the envelope and settings of the `ralph org` verbs (spawn, send,
# start, watch, escalate, and the rest) and of `ralph doctor`'s org checks:
# which drivers and models seats may run, how many seats and orgs may run,
# and the tables below. An invalid value fails the load. Absent [org] is
# fully compatible — Load() backfills these exact defaults with no warnings.
[org]
# Overriding only driver_pool (leaving model_pool unset) narrows the
# inherited default model_pool to entries whose driver is in this list —
# e.g. driver_pool = ["claude"] alone keeps loading and drops the default
# codex entries. Set model_pool explicitly to choose specific models
# instead of inheriting the filtered default.
driver_pool = ["claude", "codex"]
# model_pool entries are CLI-native model names/aliases, passed verbatim to
# `claude --model` / `codex --model`. Claude entries are stable CLI aliases
# (opus/sonnet/haiku/fable) that don't go stale like full model IDs would.
# Codex has no aliases, so codex entries are model slugs as listed in
# codex's own ~/.codex/models_cache.json, and go stale when codex retires a
# model. Each entry's driver must be present in driver_pool above.
model_pool = [
  { driver = "claude", model = "fable" },
  { driver = "claude", model = "opus" },
  { driver = "claude", model = "sonnet" },
  { driver = "claude", model = "haiku" },
  { driver = "codex", model = "gpt-6-astra" },
  { driver = "codex", model = "gpt-5.6-sol" },
  { driver = "codex", model = "gpt-5.6-terra" },
  { driver = "codex", model = "gpt-5.6-luna" },
]
# max_seats caps concurrently spawned seats per org_id namespace.
max_seats = 5
# max_orgs caps running orgs across every org_id sharing the org state dir.
# The state dir is --state-dir, else [org].state_dir (an absolute path or
# one that starts with ~/; only ralph.local.toml may set it, and this file
# fails to load with it), else the main worktree's .harness/state/org.
# ralph org spawn and ralph org start read it from the main worktree's
# ralph.toml when --config is not given and the state dir is the main
# worktree's .harness/state/org, whether found by default or named with
# --state-dir or [org].state_dir. Otherwise (--config, another state dir,
# no git repository) they read the --config file, or ./ralph.toml.
max_orgs = 10
# max_total_seats caps active seats summed across every org_id sharing the
# org state dir. Read from the same ralph.toml as max_orgs.
max_total_seats = 30
# deadman_minutes is how long a `ralph org watch` ALERT may go unanswered
# before the watch escalates it. The escalation is an ALERT item of the org
# inbox, which reaches the human like a leader's escalate does: left to the
# director and the inbox deadlines when [org.director].enabled and the watch
# accepts work, otherwise sent at once (the inbox section of the /org skill
# has the details). 0 means it is never escalated by timeout. The liveness
# mark of `ralph org watch --all` counts as stale once it is older than the
# larger of this value (10 when it is below 1) and two watch intervals.
deadman_minutes = 10
# agmsg_home points at the agmsg installation -- a directory of scripts
# (scripts/send.sh, scripts/join.sh, etc.), not a single binary. Put a
# value for your machine only in ralph.local.toml, as an absolute path or
# one that starts with ~/ (a relative one is refused there).
agmsg_home = "~/.agents/skills/agmsg"

# [org.roles] restricts which model_pool model names a role may run under.
# Absent or empty means "no restriction" — the full model_pool is allowed.
# Example:
# [org.roles]
# implementer = ["sonnet"]
# reviewer = ["opus", "gpt-6-astra"]

# [org.permissions] controls the seat permission-mode envelope: how much
# autonomy a spawned seat's driver runs with, translated to driver-native
# flags at spawn time (claude: --permission-mode bypassPermissions|
# acceptEdits|<none>). Modes: autonomous (no interactive prompts) | edits
# (auto-accept file edits, still prompts otherwise) | guarded (the driver
# CLI's own interactive default). codex seats accept every mode while
# codex_verified below is true, and only guarded once it is false -- the
# codex flag mapping depends on the codex CLI version and on your
# ~/.codex/config.toml, so check it per machine
# (docs/recipes/codex-seat-permissions.md).
[org.permissions]
default = "autonomous"
# codex_verified gates codex seats' autonomous/edits permission modes:
# true (default) maps autonomous -> `--sandbox workspace-write
# --ask-for-approval never` and edits -> `--sandbox workspace-write`. Both
# inherit the rest of your codex config (approval_policy, sandbox
# writable_roots); in particular the agmsg DB directory must be a writable
# root or seats cannot send RESULT. Check the mapping on this machine with
# docs/recipes/codex-seat-permissions.md, and again after a codex upgrade or
# a config change; if it does not pass, set false, which keeps codex
# fail-closed to guarded. An absent codex_verified loads as true.
codex_verified = true

# [org.permissions.roles] overrides the default mode per role. A role
# absent from this table uses [org.permissions].default.
# Example:
# [org.permissions.roles]
# reviewer = "guarded"
# director = "guarded"
# Note: the reviewer re-runs run-static-verify.sh / run-test.sh, so a
# guarded claude reviewer stops at the permission prompt. A guarded codex
# reviewer follows codex's own approval settings instead (whether it stops
# there is unverified).
# director sets the mode of the headless director that
# `ralph org director start` launches, in herdr or with
# [org.director].launch_cmd (it is not a seat). A codex
# director runs only in "guarded": start refuses autonomous and edits
# whatever codex_verified says, because they run codex under
# --sandbox workspace-write, which keeps .git read-only, so the director
# could not start a feature org. A guarded codex director follows
# ~/.codex/config.toml, so that config must let it write .git and reach the
# network; under sandbox_mode = "workspace-write" it meets the same wall.
# Without a director entry the director runs with default: with
# "autonomous", a claude director runs with bypassPermissions, and only its
# role prompt and the /director skill keep it from changing code. A guarded
# director gets no permission flag, so it follows the agent's own approval
# settings (the human's Claude Code or ~/.codex/config.toml; for example
# claude with permissions.defaultMode = "bypassPermissions" runs with no
# prompt).

# [org.watchdog] configures `ralph org watch`'s two layers: a deterministic
# pulse-layer timer (interval_seconds, stall_minutes) and an on-demand
# semantic-judgment watcher layer (watcher_enabled, watcher_model). Absent
# [org.watchdog] is fully compatible -- Load() backfills these exact defaults.
[org.watchdog]
interval_seconds = 30
stall_minutes = 15
watcher_enabled = true
watcher_model = "haiku"

# [org.director] sets the director switch, the inbox deadlines that
# `ralph org watch --all` checks, and auto_merge, launch_cmd, wake and
# wake_cmd below.
# enabled = true (default): `ralph org escalate` records the item in the org
# inbox, and the director, or the ack deadline below, takes it, while a
# `ralph org watch --all` accepts work; with no such watch, escalate sends
# the item to the human at once. enabled = false: escalate sends every item
# to the human at once, as before this setting existed. An absent enabled,
# or an absent [org.director], loads as true. It is read from the same
# ralph.toml as max_orgs.
# ack_minutes: an open inbox item not yet sent to the human is sent this many
# minutes after it was escalated. resolve_minutes: an item still unresolved
# this many minutes after it was escalated is sent to the human once more.
# Both must be >= 1. Absent [org.director] is fully compatible -- Load()
# backfills these exact defaults.
[org.director]
enabled = true
ack_minutes = 10
resolve_minutes = 60
# auto_merge = true (default): the director merges, without asking, each PR
# that `ralph org merge-order` lists as ready, with `ralph org merge`, and
# re-gates the other branches with `ralph org regate`. auto_merge = false:
# the director only reports the merge order, and the merges are yours; you
# can still ask the director to merge one PR with `ralph org merge`.
# Whichever value is set, `ralph org merge` checks the PR, its checks, and
# the branch protection before it merges. An absent auto_merge loads as
# true. It is read from the same ralph.toml as enabled.
auto_merge = true
# launch_cmd (empty by default: `ralph org director start` opens a herdr
# workspace) is the command start runs instead to open a terminal for the
# headless director. It is an array of arguments that ralph runs without a
# shell, after replacing {script} (the absolute path of the launch script
# ralph writes), {script_sh} (the same path single-quoted for a shell, for a
# terminal that reads its command as a shell string), {name}
# (director_<token>) and {cwd} (the main worktree root the director runs in).
# It must contain {script} or {script_sh}, and any other {...} fails the
# load. The command must return once the terminal is open; you close the
# terminal yourself after `ralph org director stop`.
# docs/recipes/director-launch-cmd.md has an example for each terminal.
# launch_cmd = ["tmux", "-L", "ralph", "new-session", "-d", "-s", "{name}", "-c", "{cwd}", "sh {script_sh}"]
# wake (default ["pull"]) is how the director learns of a new open inbox
# item. "pull": the director waits with `ralph org wait --inbox`. "push":
# when a new open inbox item arrives, `ralph org watch --all` wakes the
# director once for that item: once per cycle, one fixed line names the ids
# of all the items it was not woken for yet, never the message body. An
# item the director does not ack still reaches you at ack_minutes.
# ["pull", "push"]: both. An empty array, any other value, or a value
# listed twice fails the load.
# `ralph org director attach` (unless given --wake) and
# `ralph org director start` record this value with the director's
# registration, and the watch acts on the recorded value, so attach or
# start the director again after changing it. It is read from the same
# ralph.toml as enabled.
wake = ["pull"]
# wake_cmd (empty by default) is the command the watch runs to push a
# director. It is an array of arguments that ralph runs without a shell,
# in the directory of this ralph.toml, after replacing {target} (where the
# registration says to send: the --wake-target of
# `ralph org director attach`, the herdr pane of a headless director in
# herdr, or the terminal name director_<token> of a director started with
# launch_cmd) and {text} (the fixed wake line). The first element is the
# program to run and may not contain a placeholder; a relative path with a
# "/", such as ./scripts/wake.sh, is resolved from this file's directory,
# and a name without "/" is looked up in PATH. Any other {...} fails the
# load. With an empty wake_cmd, only a headless director in herdr can be
# pushed, by input to its herdr pane. The watch reads wake_cmd when it
# starts, so restart `ralph org watch --all` after changing it.
# {target} comes from the registration (director.jsonl, which a leader can
# write; for a promoted session, its --wake-target) and is checked only for
# its shape, so it may hold ;, $, backquotes, and spaces. Never put
# {target} inside a string a shell reads (sh -c '...', bash -c, a tmux
# shell-command, an Orca or terminal command line): give it an element of
# its own ("{target}", or a flag's value such as "--terminal", "{target}"),
# or pass it to a script that reads it quoted ("$1").
# docs/recipes/director-wake.md has an example for each terminal.
# wake_cmd = ["tmux", "-L", "ralph", "send-keys", "-t", "{target}", "-l", "{text}", ";", "send-keys", "-t", "{target}", "Enter"]

# [org.approval] sets how the plan of an org started with
# `ralph org start --plan` is approved. mode = "per-plan" (default): the
# org's implementer is spawned and given a TASK only after a human approves
# the feature's own plan with `ralph org approve`. mode = "split": the
# approval of the split plan is enough, as before this setting existed. Any
# other value, "" included, is an error. start records the mode with the org,
# so a change takes effect from the next org started, not for running ones.
# An absent [org.approval] loads as the default per-plan, so the orgs
# `ralph org start --plan` starts wait for `ralph org approve`; set
# mode = "split" to keep the behavior from before this setting.
[org.approval]
mode = "per-plan"

# [org.review] — switches of the reviews that org seats run.
# plan_advisory = true turns on the plan advisory of an org's leader, and
# cross_review = true turns on the cross-review of an org's reviewer seat;
# both are off by default. A feature org's leader reads these values with
# `ralph config get <key>`, such as
# `ralph config get org.review.cross_review`, each time it needs one, and
# treats the exit codes as the skills do with [standard] above.
# plan_advisory: the leader asks the other CLI's model for a read-only
# advisory on the feature's plan. cross_review: after the reviewer seat's
# review and before the docs sync, the leader asks the reviewer seat for a
# cross-review; the reviewer shows the branch's diff, read-only, to the model
# family the implementer does not use (codex for a claude implementer, claude
# for a codex one) and triages its findings into a report.
# max_cross_review_cycles caps the complete cross-review runs in all, the
# first one included: the default 2 is the first review and one review after
# a fix (it must be >= 1). A skipped or incomplete run does not count. At the
# cap, with findings still to fix or changes the other model has not seen,
# the leader asks the human whether to raise the cap, go on, or stop.
[org.review]
plan_advisory = false
cross_review = false
max_cross_review_cycles = 2

# [org.gate] — where the gate runs after `ralph org regate` merges the
# default branch into a feature branch. regate_checks = "local" (default):
# regate runs run-static-verify.sh and run-test.sh on this machine, records
# the result, and pushes the merge when they pass. regate_checks = "ci":
# regate pushes the merge without running them and records the gate from
# the CI checks of the branch's pull request, so it needs gh, an origin on
# GitHub, an open pull request into the default branch, and CI that runs on
# it. Any other value, "" included, is an error. regate reads it from its
# own ralph.toml (the --config file, else ./ralph.toml).
[org.gate]
regate_checks = "local"
