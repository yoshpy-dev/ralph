# ralph.toml — project-level configuration for the ralph CLI.

[doctor]
require_claude_cli = true
# Codex is optional by default — set to true to fail `ralph doctor` when
# the codex binary is missing. The accompanying `.codex/config.toml` is loaded
# only when `codex trust .` has been run for this project; see .codex/README.md.
require_codex_cli = false
require_go = false

# [org] — envelope config for the `ralph org` verb set (spawn / send / wait /
# read / stop / status / disband) and for `ralph doctor`'s org checks. The
# fields are validated so downstream PRs (seat-ification, Lead autonomy,
# Watchdog) build on a stable foundation. Absent [org] is fully compatible —
# Load() backfills these exact defaults with no warnings.
[org]
driver_pool = ["claude", "codex"]
# model_pool entries are CLI-native model names/aliases, passed verbatim to
# `claude --model` / `codex --model` (aliases don't go stale like full model
# IDs would). Each entry's driver must be present in driver_pool above.
model_pool = [
  { driver = "claude", model = "opus" },
  { driver = "claude", model = "sonnet" },
  { driver = "claude", model = "haiku" },
]
# max_seats caps concurrently spawned seats per org_id namespace.
max_seats = 5
# deadman_minutes is reserved for the PR④ Watchdog deadman timer; PR① only
# stores and round-trips this value.
deadman_minutes = 10
# agmsg_home points at the agmsg installation -- a directory of scripts
# (scripts/send.sh, scripts/join.sh, etc.), not a single binary. Env
# RALPH_ORG_AGMSG_HOME overrides this value at runtime.
agmsg_home = "~/.agents/skills/agmsg"

# [org.roles] restricts which model_pool model names a role may run under.
# Absent or empty means "no restriction" — the full model_pool is allowed.
# Example:
# [org.roles]
# reviewer = ["opus"]

# [org.permissions] controls the seat permission-mode envelope: how much
# autonomy a spawned seat's driver runs with, translated to driver-native
# flags at spawn time (claude: --permission-mode bypassPermissions|
# acceptEdits|<none>). Modes: autonomous (no interactive prompts) | edits
# (auto-accept file edits, still prompts otherwise) | guarded (the driver
# CLI's own interactive default). codex seats only accept guarded today --
# codex's interactive permission flags are fail-closed until live-verified
# (see docs/tech-debt/README.md).
[org.permissions]
default = "autonomous"
# codex_verified gates codex seats' autonomous/edits permission modes:
# false (default) keeps codex fail-closed to guarded until an operator has
# live-verified their installed codex CLI's interactive sandbox/approval
# flags (see docs/tech-debt/README.md); flip to true only after that
# verification, which unlocks the autonomous -> `--sandbox workspace-write
# --ask-for-approval never` / edits -> `--sandbox workspace-write` mapping.
codex_verified = false

# [org.permissions.roles] overrides the default mode per role. A role
# absent from this table uses [org.permissions].default.
# Example:
# [org.permissions.roles]
# reviewer = "guarded"

[org.budget]
seat_wall_clock_minutes = 30
total_wall_clock_minutes = 120
max_fix_rounds = 2

# [org.watchdog] configures `ralph org watch`'s two layers: a deterministic
# pulse-layer timer (interval_seconds, stall_minutes) and an on-demand
# semantic-judgment watcher layer (watcher_enabled, watcher_model). Absent
# [org.watchdog] is fully compatible -- Load() backfills these exact defaults.
[org.watchdog]
interval_seconds = 30
stall_minutes = 15
watcher_enabled = true
watcher_model = "haiku"
