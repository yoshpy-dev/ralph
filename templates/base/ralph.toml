# ralph.toml — project-level configuration for the ralph CLI.

[pipeline]
model = "claude-opus-4-7"
effort = "xhigh"
max_iterations = 20
max_parallel = 4
slice_timeout = "30m"
permission_mode = "auto"

[pipeline.prompts]
dir = ".ralph/prompts"

# Ralph Loop driver — which driver runs `ralph-pipeline.sh` per slice.
# Set driver = "codex" to run /loop under Codex; the env var
# RALPH_LOOP_DRIVER overrides this value at runtime.
# When driver = "codex", the cross-review reviewer is inverted (claude -p).
# claude_reviewer_model picks the Claude model used in that inverted path.
[loop]
driver = "claude"
codex_sandbox = "workspace-write"
codex_approval_policy = "on-failure"
claude_reviewer_model = "claude-opus-4-7"

[doctor]
require_claude_cli = true
# Codex is optional by default — set to true to fail `ralph doctor` when
# the codex binary is missing. The accompanying `.codex/config.toml` is loaded
# only when `codex trust .` has been run for this project; see .codex/README.md.
require_codex_cli = false
require_go = false
