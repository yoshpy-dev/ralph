# ralph.toml — project-level configuration for the ralph CLI.

[pipeline]
model = "opus"
effort = "high"
max_iterations = 20
max_parallel = 4
slice_timeout = "30m"
permission_mode = "auto"

[pipeline.prompts]
dir = ".ralph/prompts"

# Per-phase model routing (plan-big-execute-small).
# These mirror the RALPH_<PHASE>_MODEL shell defaults in scripts/ralph-config.sh.
# Precedence: env RALPH_<PHASE>_MODEL > this section > built-in default.
# Escalation applies to the implement seat when the Outer Loop enters a
# fix-and-revalidate cycle (outer cycle >= 2).
# To run everything on a single model (e.g. for rollback), set force:
#   force = "opus"   # overrides all phase models; leave commented out normally
[pipeline.phases]
implement   = "sonnet"
self_review = "opus"
verify      = "sonnet"
test        = "sonnet"
sync_docs   = "sonnet"
pr          = "sonnet"
probe       = "haiku"
escalation  = "opus"
# force = "opus"

# Ralph Loop driver — which driver runs `ralph-pipeline.sh` per slice.
# Set driver = "codex" to run /loop under Codex; the env var
# RALPH_LOOP_DRIVER overrides this value at runtime.
# When driver = "codex", the cross-review reviewer is inverted (claude -p).
# claude_reviewer_model picks the Claude model used in that inverted path.
[loop]
driver = "claude"
codex_sandbox = "workspace-write"
codex_approval_policy = "on-failure"
claude_reviewer_model = "opus"

[doctor]
require_claude_cli = true
# Codex is optional by default — set to true to fail `ralph doctor` when
# the codex binary is missing. The accompanying `.codex/config.toml` is loaded
# only when `codex trust .` has been run for this project; see .codex/README.md.
require_codex_cli = false
require_go = false
