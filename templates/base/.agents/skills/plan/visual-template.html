<!doctype html>
<!--
  Visual review page skeleton for /plan. Rules: diagrams.md (same directory).
  Copy to .harness/state/plan-visual/<slug>.html, replace every __PLACEHOLDER__,
  and replace the example figures. Keep the page self-contained: inline CSS and
  inline SVG only (no external scripts, fonts, images, or CDNs).
-->
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan visual review: __TITLE__</title>
<style>
  :root {
    --paper: #f7f5f0;
    --card: #ffffff;
    --group: #efece5;
    --ink: #1d2433;
    --muted: #6b7280;
    --line: #c9c4b8;
    --blue: #1f5fbf;
    --blue-bg: #e6eefb;
    --orange: #c2630f;
    --orange-bg: #fbeee0;
    --sans: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.7; }
  main { max-width: 1120px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 28px; line-height: 1.3; margin: 0 0 6px; }
  .meta { color: var(--muted); font-size: 13px; font-family: var(--mono); }
  .summary { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; margin: 28px 0 20px; }
  .summary section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }
  .summary h2 { font-size: 14px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
  .summary ul { margin: 0; padding-left: 1.2em; }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; font-size: 13px; color: var(--muted); margin: 0 0 36px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 22px; height: 14px; border-radius: 4px; display: inline-block; font-style: normal; }
  .sw.add { background: var(--blue-bg); border: 2px solid var(--blue); }
  .sw.mod { background: var(--orange-bg); border: 2px solid var(--orange); }
  .sw.keep { background: var(--card); border: 1.5px solid var(--line); }
  .sw.del { background: var(--card); border: 1.5px dashed var(--muted); color: var(--muted); font-size: 9px; line-height: 11px; text-align: center; }
  .sw.copy, .sw.uses { width: 26px; height: 0; border-radius: 0; border-top: 2px dashed var(--muted); }
  .sw.uses { border-top-color: var(--blue); }
  .pill { background: var(--blue); color: #fff; font-size: 11px; font-weight: 700; font-style: normal; line-height: 17px; padding: 0 8px; border-radius: 999px; }
  figure { margin: 0 0 40px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 20px 16px; }
  figure h3 { margin: 0 0 2px; font-size: 18px; }
  figure .q { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  figure .q b { color: var(--ink); font-weight: 600; }
  figure .note { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
  .out { color: var(--muted); font-size: 14px; }
  .out b { color: var(--ink); }
  /* SVG: text inherits ink, sans, and 13px; the classes below carry the
     visual vocabulary from diagrams.md. */
  svg { width: 100%; height: auto; display: block; fill: var(--ink); font-family: var(--sans); font-size: 13px; }
  svg .mono { font-family: var(--mono); }
  svg .sub { fill: var(--muted); font-size: 12px; }
  svg .group { fill: var(--group); }
  svg .node { stroke-width: 1.5; }
  svg .keep { fill: var(--card); stroke: var(--line); }
  svg .add { fill: var(--blue-bg); stroke: var(--blue); stroke-width: 2; }
  svg .mod { fill: var(--orange-bg); stroke: var(--orange); stroke-width: 2; }
  svg .del { fill: var(--card); stroke: var(--muted); stroke-dasharray: 5 4; }
  svg .edge { fill: none; stroke: var(--ink); stroke-width: 1.5; }
  svg .edge.copy { stroke: var(--muted); stroke-dasharray: 4 4; }
  svg .edge.uses { stroke: var(--blue); stroke-dasharray: 4 4; }
  svg .arrowhead { fill: var(--ink); }
  svg .arrowhead.blue { fill: var(--blue); }
  svg .arrowhead.muted { fill: var(--muted); }
  svg .badge { fill: var(--blue); }
  svg .badge-text { fill: #fff; font-size: 11px; font-weight: 700; }
  svg .label-bg { fill: var(--card); }
  /* <page>#overview (or any #<figure-id>): show only that figure. */
  body:has(figure:target) .chrome,
  body:has(figure:target) figure:not(:target) { display: none; }
  body:has(figure:target) main { padding: 16px; }
  body:has(figure:target) figure { margin: 0; }
  @media (max-width: 720px) { .summary { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <div class="chrome">
    <!-- Header: plan title, plan path, branch -->
    <h1>__TITLE__</h1>
    <div class="meta">__PLAN_PATH__ · __BRANCH__</div>

    <!-- Summary: a few bullets each, tagged with slice ids. Translate the
         headings into the page language. -->
    <div class="summary">
      <section>
        <h2>What changes</h2>
        <ul>
          <li>__CHANGE__ (S1)</li>
        </ul>
      </section>
      <section>
        <h2>What stays</h2>
        <ul>
          <li>__UNCHANGED__</li>
        </ul>
      </section>
    </div>

    <!-- Legend: always present; drop entries no figure uses. -->
    <div class="legend">
      <span><i class="sw add"></i>Added</span>
      <span><i class="sw mod"></i>Changed</span>
      <span><i class="sw keep"></i>Existing (unchanged)</span>
      <span><i class="sw del">✕</i>Removed</span>
      <span><i class="sw copy"></i>Copy / generated</span>
      <span><i class="sw uses"></i>Uses this part</span>
      <span><i class="pill">S1</i>Slice</span>
    </div>
  </div>

  <!-- Overview: always first. Every feature or slice on one canvas, each part
       labeled with its slice or AC id. The example below shows the vocabulary;
       replace it. -->
  <figure id="overview">
    <h3>Figure 1 · Overview</h3>
    <p class="q"><b>What to check:</b> __QUESTION__</p>
    <svg viewBox="0 0 1080 200" role="img" aria-label="__OVERVIEW_ALT__">
      <defs>
        <marker id="ov-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker>
      </defs>
      <rect x="20" y="20" width="1040" height="160" rx="14" class="group"/>
      <text x="40" y="48" font-size="15" font-weight="700">area (group)</text>

      <rect x="60" y="80" width="260" height="56" rx="8" class="node keep"/>
      <text x="74" y="104" class="mono">path/to/existing</text>
      <text x="74" y="124" class="sub">existing, unchanged</text>

      <rect x="410" y="80" width="260" height="56" rx="8" class="node add"/>
      <text x="424" y="104" class="mono">path/to/new-part</text>
      <text x="424" y="124" class="sub">added</text>
      <rect x="638" y="71" width="32" height="17" rx="8.5" class="badge"/>
      <text x="654" y="83.5" text-anchor="middle" class="badge-text">S1</text>

      <rect x="760" y="80" width="260" height="56" rx="8" class="node mod"/>
      <text x="774" y="104" class="mono">path/to/changed</text>
      <text x="774" y="124" class="sub">changed</text>
      <rect x="988" y="71" width="32" height="17" rx="8.5" class="badge"/>
      <text x="1004" y="83.5" text-anchor="middle" class="badge-text">S2</text>

      <line x1="320" y1="108" x2="408" y2="108" class="edge" marker-end="url(#ov-arrow)"/>
      <text x="365" y="100" font-size="12" text-anchor="middle">calls</text>
      <line x1="670" y1="108" x2="758" y2="108" class="edge" marker-end="url(#ov-arrow)"/>
      <text x="715" y="100" font-size="12" text-anchor="middle">updates</text>
    </svg>
    <!-- Optional: <p class="note">one line of context the figure cannot show</p> -->
  </figure>

  <!-- Detail figures: one per question the approver needs answered (at most 4).
       Pick the type from diagrams.md; give each figure its own id and its own
       <defs> with markers prefixed by that id. -->
  <figure id="detail-1">
    <h3>Figure 2 · __DETAIL_TITLE__</h3>
    <p class="q"><b>What to check:</b> __QUESTION__</p>
    <svg viewBox="0 0 1080 140" role="img" aria-label="__DETAIL_ALT__">
      <rect x="20" y="20" width="1040" height="100" rx="10" fill="none" stroke="#c9c4b8" stroke-width="1.5" stroke-dasharray="6 6"/>
      <text x="540" y="75" text-anchor="middle" class="sub">Replace with one figure type from diagrams.md: sequence, state, structure, before/after, or file map</text>
    </svg>
  </figure>

  <!-- Not in this page: the plan's non-goals. -->
  <p class="out chrome"><b>Not in this page:</b> __NON_GOALS__</p>
</main>
</body>
</html>
